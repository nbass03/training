<!DOCTYPE html>
<html lang="fr">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="apple-touch-icon" sizes="180x180" href="img/icon-180-v2.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">
  <meta name="color-scheme" content="dark">
  <title>Mon Programme</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      background: #121212;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    h1, h2, h4, p { margin: 10px 0; }
    .page { display: none; flex: 1; flex-direction: column; text-align: center; padding: 20px; overflow-y: auto;  padding-bottom: 300px; }
    .active { display: flex; }

    .button {
      display: block;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .home-buttons .button {
      background: #F2F2F7;  
      color: #000;           
      font-weight: 500;
      font-size: 20px;
      border-radius: 16px;
      padding: 16px;
      margin: 12px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }
    .home-buttons .button:active {
      background: #E5E5EA;
      transform: scale(0.98);
    }

    .grid { display: flex; flex-direction: column; gap: 15px; width: 100%; margin: 20px 0; align-content: center; }
    .card { background: #1e1e1e; border-radius: 10px; padding: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
    .card img { width: 100%; border-radius: 8px; }

    .superset { display: flex; flex-direction: column; gap: 15px; margin: 20px 0; width: 100%; align-items: stretch; align-content: center; flex-wrap: wrap; }
    #dayGrid .exercise {
      display: flex;
      gap: 12px;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 10px;
      width: 100%;
      flex-direction: row;
      justify-content: left;
      text-align: left;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    #dayGrid .exercise img { width: 40%; border-radius: 8px; }
    #dayGrid .exercise .exercise_info { display: flex; flex-direction: column; justify-content: center; }
    .exercise { background: #1e1e1e; border-radius: 10px; padding: 10px; width: 100%; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
    .exercise img { width: 100%; border-radius: 8px; }
    .pause { margin-top: 10px; font-size: 16px; font-style: italic; color: #bbb; }

    .nav-buttons {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #121212;
      padding: 10px 20px 20px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.4);
    }
    .nav-buttons .button.retour {
      flex: 1;
      max-width: 120px;
      background: #E5E5EA;
      color: #000;
      font-weight: 500;
      border-radius: 12px;
      padding: 12px;
    }
    .nav-buttons .button.retour:active { background: #CACACA; }
    .nav-buttons .button.suivant {
      flex: 2;
      background: #0A84FF;
      color: #fff;
      font-weight: 600;
      border-radius: 12px;
      padding: 12px;
    }
    .nav-buttons .button.suivant:active { background: #0060DF; }
    #home { justify-content: flex-start; padding-top: 40px; }
    .home-buttons { display: flex; flex-direction: column; justify-content: center; flex: 1; }

    .reset { margin-top: 8px; background: #0A84FF; color: #fff; border: none; border-radius: 12px; padding: 10px 16px; cursor: pointer; }
    .reset:active { background: #0060DF; }
  </style>
</head>
<body>

<!-- Page accueil -->
<div id="home" class="page active">
  <h1>Mon Programme</h1>
  <div class="home-buttons">
    <a href="#" class="button" onclick="openDay(1)">Jour 1</a>
    <a href="#" class="button" onclick="openDay(2)">Jour 2</a>
    <a href="#" class="button" onclick="openDay(3)">Jour 3</a>
    <a href="#" class="button" onclick="openDay(4)">Jour 4</a>
  </div>
</div>

<!-- Page Jour -->
<div id="dayPage" class="page">
  <h2 id="dayTitle">Jour X</h2>
  <div class="grid" id="dayGrid"></div>
  <div class="nav-buttons">
    <a href="#" class="button retour" onclick="goHome()">Retour</a>
    <a href="#" class="button suivant" onclick="startWorkout()">Démarrer</a>
  </div>
</div>

<!-- Page Entraînement -->
<div id="workoutPage" class="page">
  <h2 id="blockTitle">Bloc 1</h2>
  <div class="superset" id="supersetBlock"></div>
  <div class="pause">
    Repos : <span id="pauseTime">--</span>
    <span id="repCounter"> (0)</span>
    <br>
    <button class="reset" onclick="initAudio(); startRest();">Démarrer / Reset repos</button>
  </div>
  <div class="nav-buttons">
    <a href="#" class="button retour">Retour</a>
    <a href="#" class="button suivant" onclick="nextBlock()">Suivant</a>
  </div>
</div>

<script>
  // --- DONNÉES DU PROGRAMME ---
  const programme = {
    1: [
      { pause: "90s", exos: [{ nom: "Pendulum squat", reps: "4 × 8", img: "img/pendulum.jpg" }] },
      { pause: "90s", exos: [{ nom: "Leg press (pied bas)", reps: "3 × 10", img: "img/leg-press.jpg" }] },
      { pause: "90s", exos: [{ nom: "Split squat", reps: "3 × 10 par jambe", img: "img/split_squat.jpg" }] },
      { pause: "1min", exos: [{ nom: "Leg extension", reps: "3 × 12–15", img: "img/leg-extension.jpg" }] },
      { pause: "1min", exos: [{ nom: "Adductors machine", reps: "3 × 12–15", img: "img/adduction.png" }] },
      { pause: "1min", exos: [{ nom: "Biceps curl machine", reps: "3 × 12–15", img: "img/biceps_curl.jpg" }] },
      { pause: "1min", exos: [{ nom: "Avant-bras prise supination", reps: "2 × 10", img: "img/avant-bras-suppination.png" }, { nom: "Avant-bras prise pronation", reps: "2 × 10", img: "img/avant-bras-pronation.gif" }] }
    ],
    2: [
      { pause: "90s", exos: [{ nom: "Bench press", reps: "4 × 8–10", img: "img/Bench-Press.gif" }] },
      { pause: "90s", exos: [{ nom: "Incline chest press machine", reps: "3 × 10–12", img: "img/Incline-Chest-Press-Machine.gif" }] },
      { pause: "75s", exos: [{ nom: "Seated chest press (pronation)", reps: "3 × 10–12", img: "img/chest-press.jpg" }] },
      { pause: "75s", exos: [{ nom: "Cable fly (on pulley)", reps: "3 × 12–15", img: "img/cable_fly.png" }] },
      { pause: "1min", exos: [{ nom: "Decline chest press", reps: "3 × 12", img: "img/decline_chest_press.png" }] },
      { pause: "1min", exos: [{ nom: "ABS machine", reps: "3 × 12", img: "img/abs_machine.png" }, { nom: "Leg raise", reps: "3 × 12", img: "img/leg_raise.jpg" }] }
    ],
    3: [
      { pause: "90s", exos: [{ nom: "Deadlift", reps: "3 × 10", img: "img/dead-lift.png" }] },
      { pause: "90s", exos: [{ nom: "Hip thrust", reps: "4 × 10", img: "img/hip_thust.gif" }] },
      { pause: "90s", exos: [{ nom: "Seated leg curl", reps: "3 × 12", img: "img/seated_leg_curl.jpg" }] },
      { pause: "90s", exos: [{ nom: "Hack squat good morning", reps: "2–3 × 12", img: "img/hack_squat-gm.png" }] },
      { pause: "1min", exos: [{ nom: "Abductors machine", reps: "3 × 15", img: "img/abductor.png" }] },
      { pause: "1min", exos: [{ nom: "Seated calf raise", reps: "3 × 15", img: "img/calf_raise.png" }] },
      { pause: "1min", exos: [{ nom: "Triceps pushdown machine", reps: "3 × 15", img: "img/triceps_pushdown.jpg" }] }
    ],
    4: [
      { pause: "90s", exos: [{ nom: "Hammer strength machine", reps: "4 × 10", img: "img/hammer_strenght.jpg" }] },
      { pause: "90s", exos: [{ nom: "T-bar row (prise large)", reps: "3 × 10", img: "img/t_bar.gif" }] },
      { pause: "75s", exos: [{ nom: "One DB row", reps: "3 × 10–12 par bras", img: "img/one_db_row.png" }] },
      { pause: "75s", exos: [{ nom: "Lat pull down (prise neutre)", reps: "3 × 10–12", img: "img/lat_pull_down.png" }] },
      { pause: "1min", exos: [{ nom: "Cable facepull", reps: "3 × 12–15", img: "img/facepull.jpg" }] },
      { pause: "1min", exos: [{ nom: "Cable twist", reps: "3 × 12 par côté", img: "img/cable_twist.png" }, { nom: "Bicycle crunch", reps: "3 × 20–30", img: "img/bicycle_crunch.png" }] }
    ]
  };

  // --- VARIABLES GLOBALES ---
  let currentDay = 1;
  let currentBlock = 0;
  let restInterval;
  let blockReps = {}; // compteur reps par bloc

  // --- AUDIO CONTEXT ---
  let audioCtx;
  let audioReady = false;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioReady = true;
    }
  }

  function playBeep() {
    if (!audioReady) return;

    audioCtx.resume().then(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'square';
      osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
      osc.onended = () => {
        osc.disconnect();
        gain.disconnect();
      };
    }).catch(e => console.error('Erreur resume():', e));
  }

  // --- NAVIGATION PAGES ---
  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function goHome() { showPage('home'); }

  function openDay(day) {
    currentDay = day;
    document.getElementById('dayTitle').innerText = "Jour " + day;
    const grid = document.getElementById('dayGrid');
    grid.innerHTML = '';
    programme[day].forEach((bloc, i) => {
      let blocHTML = `<div class="superset"><h3>Bloc ${i+1} (Repos : ${bloc.pause})</h3>`;
      bloc.exos.forEach(exo => {
        blocHTML += `<div class="exercise">
          <img src="${exo.img}" alt="">
          <div class="exercise_info">
            <h4>${exo.nom}</h4>
            <p>${exo.reps}</p>
          </div>
        </div>`;
      });
      blocHTML += `</div>`;
      grid.innerHTML += blocHTML;
    });
    document.querySelector('#dayPage .button.suivant').innerText = "Démarrer";
    showPage('dayPage');
  }

  function startWorkout() {
    currentBlock = 0;
    showBlock();
    showPage('workoutPage');
  }

  function showBlock() {
    clearInterval(restInterval);
    const bloc = programme[currentDay][currentBlock];
    document.getElementById('blockTitle').innerText = "Bloc " + (currentBlock + 1);
    const supersetDiv = document.getElementById('supersetBlock');
    supersetDiv.innerHTML = '';
    bloc.exos.forEach(exo => {
      supersetDiv.innerHTML += `
        <div class="exercise">
          <img src="${exo.img}" alt="">
          <h4>${exo.nom}</h4>
          <p>${exo.reps}</p>
        </div>`;
    });
    document.getElementById('pauseTime').innerText = bloc.pause;

    // initialise compteur du bloc à 0 si inexistant
    const key = currentDay + "-" + currentBlock;
    if (blockReps[key] === undefined) {
      blockReps[key] = 0;
    }
    document.getElementById("repCounter").textContent = ` (${blockReps[key]})`;
  }

  function parsePause(pause) {
    if (pause.includes("min")) return parseInt(pause) * 60;
    if (pause.includes("s")) return parseInt(pause);
    return 60;
  }

  function startRest() {
    clearInterval(restInterval);

    // incrémente compteur
    const key = currentDay + "-" + currentBlock;
    blockReps[key]++;
    document.getElementById("repCounter").textContent = ` (${blockReps[key]})`;

    let duration = parsePause(programme[currentDay][currentBlock].pause);
    const display = document.getElementById("pauseTime");

    function update() {
      let minutes = Math.floor(duration / 60);
      let seconds = duration % 60;
      display.textContent = minutes > 0
        ? `${minutes}:${seconds.toString().padStart(2,"0")}`
        : `${seconds}s`;

      if (duration <= 0) {
        clearInterval(restInterval);
        playBeep();
      }
      duration--;
    }

    update();
    restInterval = setInterval(update, 1000);
  }

  function nextBlock() {
    if (currentBlock < programme[currentDay].length - 1) {
      currentBlock++;
      showBlock();
    } else {
      alert("Entraînement terminé 🎉");
      goHome();
    }
  }

  document.querySelector('#workoutPage .button.retour').onclick = function(e) {
    e.preventDefault();
    if (currentBlock > 0) currentBlock--;
    showBlock();
  };
</script>
</body>
</html>
